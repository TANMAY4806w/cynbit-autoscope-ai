services:
  - type: web
    name: autoscope-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && npm --prefix web-app install && npm --prefix web-app run build"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
